<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LibreTools - Free, Private, Secure, Open-Source Tools">
    <title>LibreTools</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-content">
        <a href="index.html" class="logo">LibreTools</a>
    </div>
</header>

<main>

    <section class="intro">
        <h1>LibreTools</h1>
        <p>Free, Private, Secure, Open-Source Tools</p>
    </section>

    <section class="search-tools">

        <input
            class="field"
            type="search"
            id="tool-search"
            placeholder="Search tools..."
        >

        <a href="tools/password-generator.html" class="tool">
            <span class="tool-name">Password Generator</span>
            <span class="tool-description">Generate secure passwords locally
            </span>
        </a>

        <a href="tools/sha256-generator.html" class="tool">
            <span class="tool-name">SHA-256 Generator</span>
            <span class="tool-description">Generate SHA-256 hashes locally</span>
        </a>
        
        <a href="tools/color-picker.html" class="tool">
            <span class="tool-name">Color Picker</span>
            <span class="tool-description">Pick colors from images locally</span>
        </a>
        
    </section>

</main>

<footer>
    <span>Made by Ietsiee</span>

    <div class="footer-links">
        <a href="https://github.com/Ietsiee/LibreTools">source</a>
        <a href="https://github.com/Ietsiee/LibreTools/blob/main/LICENSE">license</a>
    </div>
</footer>

<script>
    const search = document.getElementById("tool-search");
    const tools = document.querySelectorAll(".tool");

    search.addEventListener("input", () => {
        const query = search.value.toLowerCase();

        tools.forEach(tool => {
            tool.style.display = tool.textContent.toLowerCase().includes(query)
                ? ""
                : "none";
        });
    });
</script>

</body>
</html>
