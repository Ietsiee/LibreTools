<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate secure passwords locally with LibreTools">
    <title>Password Generator - LibreTools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">LibreTools</a>
        </div>
    </header>

    <main>

        <section class="intro">
            <h1>Password Generator</h1>
            <p>Generate a secure password locally</p>
        </section>

        <section class="generator">

            <div class="option">
                <label for="length">Password length</label>
                <input type="number" id="length" value="16" min="6" max="128">
            </div>

            <div class="options">

                <label class="checkbox">
                    <input type="checkbox" id="lowercase" checked>
                    <span>Lowercase</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="uppercase" checked>
                    <span>Uppercase</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="numbers" checked>
                    <span>Numbers</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="symbols" checked>
                    <span>Symbols</span>
                </label>

            </div>

            <button onclick="generatePassword()">Generate Password</button>

            <div class="result">
                <input type="text" id="password" readonly>
                <button onclick="copyPassword()">Copy</button>
            </div>

        </section>

    </main>

    <footer>
        <span>Made by Ietsiee</span>

        <div class="footer-links">
            <a href="https://github.com/Ietsiee/LibreTools">source</a>
            <a href="https://github.com/Ietsiee/LibreTools/blob/main/LICENSE">license</a>
        </div>
    </footer>

    <script>
        function generatePassword() {
            const length = Math.min(
                128,
                Math.max(6, Number(document.getElementById("length").value))
            );

            let characters = "";

            if (document.getElementById("lowercase").checked)
                characters += "abcdefghijklmnopqrstuvwxyz";

            if (document.getElementById("uppercase").checked)
                characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            if (document.getElementById("numbers").checked)
                characters += "0123456789";

            if (document.getElementById("symbols").checked)
                characters += "!@#$%^&*()-_=+[]{};:,.?";

            if (!characters) {
                alert("Select at least one character type.");
                return;
            }

            const randomValues = new Uint32Array(length);
            crypto.getRandomValues(randomValues);

            let password = "";

            for (let i = 0; i < length; i++) {
                password += characters[randomValues[i] % characters.length];
            }

            document.getElementById("password").value = password;
        }

        function copyPassword() {
            const password = document.getElementById("password").value;

            if (!password) return;

            navigator.clipboard.writeText(password);
        }

        generatePassword();
    </script>

</body>
</html>
